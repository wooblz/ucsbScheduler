<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCSB Scheduler</title>
    
    <style>
        :root {
            /* DEFAULT: Light Mode */
            --bg-color: #ffffff;
            --text-color: #000000;
            --container-bg: #f8f9fa;
            --border-color: #ccc;
            --accent-color: #007bff;
            --item-bg: #ffffff;
            --cart-bg: #f0f8ff;
            --button-text: #fff;
            --table-header-bg: #f8f9fa;
            --table-cell-bg: #fff;
            --input-bg: #fff;
            --input-text: #000;
            
            --card-bg: #e3f2fd;
            --card-border: #2196f3;
            --card-text: #000;
            --final-bg: #fff3cd;
            --final-border: #ffc107;
        }

        body.dark-mode {
            /* Dark Mode Overrides */
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --container-bg: #1e1e1e;
            --border-color: #333;
            --accent-color: #3788d8;
            --item-bg: #2c2c2c;
            --cart-bg: #1e2a36;
            --button-text: #fff;
            --table-header-bg: #252525;
            --table-cell-bg: #181818;
            --input-bg: #2c2c2c;
            --input-text: #fff;

            --card-bg: #0277bd;
            --card-border: #4fc3f7;
            --card-text: #fff;
            --final-bg: #ff8f00;
            --final-border: #ffb300;
        }

        body { 
            font-family: sans-serif; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
        }
        
        .search-box { margin-bottom: 20px; display: flex; gap: 10px; }
        .search-box input { 
            flex-grow: 1; 
            padding: 8px; 
            font-size: 16px; 
            background-color: var(--input-bg);
            color: var(--input-text);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        
        .result-item { 
            border: 1px solid var(--border-color); 
            padding: 15px; 
            margin-bottom: 10px; 
            border-radius: 5px; 
            background-color: var(--item-bg);
        }
        
        .section-item { 
            margin-left: 20px; 
            padding: 5px; 
            border-left: 2px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .cart { 
            background: var(--cart-bg); 
            padding: 15px; 
            border-radius: 5px; 
            margin-bottom: 20px; 
            border: 1px solid var(--border-color); 
        }

        #selected-list {
            list-style: none;
            padding: 0;
        }
        #selected-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid var(--border-color);
        }
        
        .cart-controls { display: flex; gap: 10px; margin-top: 10px; }
        
        button { cursor: pointer; padding: 10px; border-radius: 5px; border: none; font-size: 14px; }
        .btn-add { background: var(--accent-color); color: var(--button-text); padding: 5px 10px; }
        
        .btn-rm { 
            background: #dc3545; 
            color: white; 
            padding: 2px 8px; 
            font-size: 12px; 
            margin-left: 10px;
        }

        .btn-dl { background: #28a745; color: white; width: 100%; font-size: 16px; }
        .btn-dl:disabled { background: #555; cursor: not-allowed; }

        /* Schedule Table Styles */
        #schedule-view { margin-top: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 800px; }
        
        th, td { 
            border: 1px solid var(--border-color); 
            padding: 8px; 
            text-align: left; 
            vertical-align: top; 
        }
        th { 
            background-color: var(--table-header-bg); 
            text-align: center; 
            padding: 12px; 
            font-weight: bold; 
            color: var(--text-color);
        }
        td { 
            height: 150px; 
            background: var(--table-cell-bg); 
        }
        
        .event-card { 
            background: var(--card-bg);
            color: var(--card-text);
            border-left: 4px solid var(--card-border); 
            padding: 6px; 
            margin-bottom: 6px; 
            border-radius: 3px; 
            font-size: 0.85em; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .event-final {
            background: var(--final-bg);
            border-left-color: var(--final-border);
        }

        .event-time { font-weight: bold; display: block; margin-bottom: 2px; }
        .event-loc { font-size: 0.9em; opacity: 0.9; }
    </style>
</head>
<body>

    <div class="header-controls">
        <h1>UCSB Calendar Generator (Winter 2026)</h1>
        <button class="theme-btn" onclick="toggleTheme()">Switch to Dark Mode</button>
    </div>

    <div class="cart">
        <h3>Selected Classes (<span id="count">0</span>)</h3>
        <ul id="selected-list"></ul>
        <div class="cart-controls">
            <button id="dl-btn" class="btn-dl" onclick="downloadICS()" disabled>Download .ICS File</button>
        </div>

        <div id="schedule-view">
            <table>
                <thead>
                    <tr>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                        <th>Finals</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="col-M"></td>
                        <td id="col-T"></td>
                        <td id="col-W"></td>
                        <td id="col-R"></td>
                        <td id="col-F"></td>
                        <td id="col-Finals"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="query" placeholder="Search (e.g. CMPSC 16)" oninput="handleTyping()">
    </div>

    <div id="results"></div>

    <script>
        let selectedItems = [];
        let debounceTimer;

        const QUARTER = "20261"; 

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const btn = document.querySelector('.theme-btn');
            if (document.body.classList.contains('dark-mode')) {
                btn.innerText = "Switch to Light Mode";
            } else {
                btn.innerText = "Switch to Dark Mode";
            }
        }

        function handleTyping() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(searchClasses, 100);
        }

        async function searchClasses() {
            const query = document.getElementById('query').value;
            if (query.trim() === "") {
                document.getElementById('results').innerHTML = "";
                return;
            }

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                if (!res.ok) throw new Error("Search failed");
                const data = await res.json();
                
                const container = document.getElementById('results');
                container.innerHTML = '';

                if (!data || data.length === 0) {
                    container.innerHTML = '<p>No results found.</p>';
                    return;
                }

                data.forEach(cls => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    
                    let html = `<strong>${cls.courseId} - ${cls.title}</strong><br>
                                <span style="font-size:0.9em; opacity:0.8">Lecture: ${cls.Days} ${cls.BeginTime}-${cls.EndTime} (${cls.Building} ${cls.Room})</span><br>`;
                    
                    if (cls.classSections && cls.classSections.length > 0) {
                        html += `<div style="margin-top:5px; font-size: 0.9em; opacity: 0.7;">Sections:</div>`;
                        cls.classSections.forEach(sec => {
                            const t = sec.timeLocations[0];
                            const timeStr = t ? `${t.days} ${t.beginTime}-${t.endTime}` : "TBA";
                            html += `
                            <div class="section-item">
                                <span>${sec.enrollCode}: ${timeStr}</span>
                                <button class="btn-add" onclick="addItem('${sec.enrollCode}', '${cls.courseId} Sec ${sec.enrollCode}')">Select</button>
                            </div>`;
                        });
                    } else if (cls.EnrollCode) {
                        html += `<button class="btn-add" onclick="addItem('${cls.EnrollCode}', '${cls.courseId}')">Select Course</button>`;
                    }
                    div.innerHTML = html;
                    container.appendChild(div);
                });
            } catch (error) {
                console.error(error);
            }
        }

        function addItem(code, name) {
            if (selectedItems.find(i => i.code === code)) return;
            selectedItems.push({ code, name });
            updateCart();
        }

        function removeItem(code) {
            selectedItems = selectedItems.filter(i => i.code !== code);
            updateCart();
        }

        function updateCart() {
            document.getElementById('count').innerText = selectedItems.length;
            
            document.getElementById('selected-list').innerHTML = selectedItems.map(i => `
                <li>
                    <span>${i.name} (${i.code})</span>
                    <button class="btn-rm" onclick="removeItem('${i.code}')">Remove</button>
                </li>
            `).join('');

            document.getElementById('dl-btn').disabled = selectedItems.length === 0;
            updateScheduleTable();
        }

        async function updateScheduleTable() {
            const cols = ['M', 'T', 'W', 'R', 'F', 'Finals'];
            cols.forEach(c => document.getElementById('col-' + c).innerHTML = '');

            if (selectedItems.length === 0) return;

            try {
                const response = await fetch('/api/calendar?format=preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        quarter: QUARTER,
                        enrollCodes: selectedItems.map(i => i.code)
                    })
                });

                if (!response.ok) return;

                const events = await response.json();
                
                events.sort((a, b) => a.start.localeCompare(b.start));

                events.forEach(ev => {
                    const startDate = new Date(ev.start);
                    let isFinal = false;

                    if (ev.description === "Final Exam" || ev.title.includes("Final-")) {
                        renderEventCard("Finals", ev, true, startDate);
                        return;
                    }

                    if (ev.rrule && ev.rrule.includes("BYDAY=")) {
                        const byDayPart = ev.rrule.split('BYDAY=')[1].split(';')[0]; // "MO,WE"
                        const days = byDayPart.split(','); // ["MO", "WE"]
                        
                        // Map ical days to our column IDs
                        const dayMap = {"MO":"M", "TU":"T", "WE":"W", "TH":"R", "FR":"F"};
                        
                        days.forEach(d => {
                            if (dayMap[d]) {
                                renderEventCard(dayMap[d], ev, false, startDate);
                            }
                        });
                    } else {
                        const jsDay = startDate.getDay(); // 0=Sun, 1=Mon...
                        const dayMap = {1: 'M', 2: 'T', 3: 'W', 4: 'R', 5: 'F'};
                        if (dayMap[jsDay]) {
                            renderEventCard(dayMap[jsDay], ev, false, startDate);
                        }
                    }
                });

            } catch (e) {
                console.error("Error updating schedule:", e);
            }
        }

        function renderEventCard(colId, ev, isFinal, startDate) {
            const div = document.createElement('div');
            div.className = isFinal ? 'event-card event-final' : 'event-card';

            let timeStr = "";
            let endTimeStr = "";
            
            if (ev.duration) {
                const [h, m] = ev.duration.split(':').map(Number);
                const endDate = new Date(startDate.getTime() + (h * 60 * 60 * 1000) + (m * 60 * 1000));
                endTimeStr = formatTime(endDate);
                timeStr = formatTime(startDate) + " - " + endTimeStr;
            } else if (ev.end) {
                timeStr = formatTime(startDate) + " - " + formatTime(new Date(ev.end));
            } else {
                timeStr = formatTime(startDate);
            }

            let html = `<span class="event-time">${timeStr}</span>`;
            html += `<strong>${ev.title}</strong><br>`;
            html += `<span class="event-loc">${ev.location}</span>`;

            if (isFinal) {
                html += `<br><span style="font-size:0.8em; opacity: 0.9;">${startDate.toLocaleDateString()}</span>`;
            }

            div.innerHTML = html;
            document.getElementById('col-' + colId).appendChild(div);
        }

        function formatTime(date) {
            return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }

        async function downloadICS() {
            const response = await fetch('/api/calendar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    quarter: QUARTER,
                    enrollCodes: selectedItems.map(i => i.code)
                })
            });

            if (!response.ok) {
                alert("Error generating calendar");
                return;
            }

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "schedule.ics";
            document.body.appendChild(a);
            a.click();
            a.remove();
        }
    </script>
</body>
</html>
