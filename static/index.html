<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCSB Scheduler</title>
    
    <script src='https://cdn.jsdelivr.net/npm/rrule@2.6.4/dist/es5/rrule.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/rrule@6.1.10/index.global.min.js'></script>

    <style>
        body { font-family: sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; }
        .search-box { margin-bottom: 20px; display: flex; gap: 10px; }
        .search-box input { flex-grow: 1; padding: 8px; }
        .result-item { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .section-item { margin-left: 20px; padding: 5px; border-left: 2px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        
        .cart { background: #f0f8ff; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #b0d4f1; }
        .cart-controls { display: flex; gap: 10px; margin-top: 10px; }
        
        button { cursor: pointer; padding: 10px; border-radius: 5px; border: none; font-size: 14px; }
        .btn-add { background: #007bff; color: white; padding: 5px 10px; }
        .btn-dl { background: #28a745; color: white; flex: 1; }
        .btn-prev { background: #17a2b8; color: white; flex: 1; }
        .btn-dl:disabled, .btn-prev:disabled { background: #ccc; cursor: not-allowed; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 5% auto; padding: 20px; border-radius: 5px; width: 90%; height: 80%; overflow: hidden; display: flex; flex-direction: column; }
        .close-btn { align-self: flex-end; font-size: 24px; cursor: pointer; }
        #calendar { flex-grow: 1; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>UCSB Calendar Generator (Winter 2026)</h1>

    <div class="cart">
        <h3>Selected Classes (<span id="count">0</span>)</h3>
        <ul id="selected-list"></ul>
        <div class="cart-controls">
            <button id="prev-btn" class="btn-prev" onclick="previewCalendar()" disabled>Preview Calendar</button>
            <button id="dl-btn" class="btn-dl" onclick="downloadICS()" disabled>Download .ICS File</button>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="query" placeholder="Search (e.g. CMPSC 16)" oninput="handleTyping()">
    </div>

    <div id="results"></div>

    <div id="calModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="calendar"></div>
        </div>
    </div>

    <script>
        let selectedItems = [];
        let debounceTimer;
        let calendar = null;

        const QUARTER = "20261"; 

        function handleTyping() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(searchClasses, 100);
        }

        async function searchClasses() {
            const query = document.getElementById('query').value;
            if (query.trim() === "") {
                document.getElementById('results').innerHTML = "";
                return;
            }

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                if (!res.ok) throw new Error("Search failed");
                const data = await res.json();
                
                const container = document.getElementById('results');
                container.innerHTML = '';

                if (!data || data.length === 0) {
                    container.innerHTML = '<p>No results found.</p>';
                    return;
                }

                data.forEach(cls => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    
                    let html = `<strong>${cls.courseId} - ${cls.title}</strong><br>
                                Lecture: ${cls.Days} ${cls.BeginTime}-${cls.EndTime} (${cls.Building} ${cls.Room})<br>`;
                    
                    if (cls.classSections && cls.classSections.length > 0) {
                        html += `<div style="margin-top:5px; font-size: 0.9em; color: #555;">Sections:</div>`;
                        cls.classSections.forEach(sec => {
                            const t = sec.timeLocations[0];
                            const timeStr = t ? `${t.days} ${t.beginTime}-${t.endTime}` : "TBA";
                            html += `
                            <div class="section-item">
                                <span>${sec.enrollCode}: ${timeStr}</span>
                                <button class="btn-add" onclick="addItem('${sec.enrollCode}', '${cls.courseId} Sec ${sec.enrollCode}')">Select</button>
                            </div>`;
                        });
                    } else if (cls.EnrollCode) {
                        html += `<button class="btn-add" onclick="addItem('${cls.EnrollCode}', '${cls.courseId}')">Select Course</button>`;
                    }
                    div.innerHTML = html;
                    container.appendChild(div);
                });
            } catch (error) {
                console.error(error);
            }
        }

        function addItem(code, name) {
            if (selectedItems.find(i => i.code === code)) return;
            selectedItems.push({ code, name });
            updateCart();
        }

        function updateCart() {
            document.getElementById('count').innerText = selectedItems.length;
            document.getElementById('selected-list').innerHTML = selectedItems.map(i => `<li>${i.name} (${i.code})</li>`).join('');
            document.getElementById('dl-btn').disabled = selectedItems.length === 0;
            document.getElementById('prev-btn').disabled = selectedItems.length === 0;
        }

        async function downloadICS() {
            const response = await fetch('/api/calendar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    quarter: QUARTER,
                    enrollCodes: selectedItems.map(i => i.code)
                })
            });

            if (!response.ok) {
                alert("Error generating calendar");
                return;
            }

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "schedule.ics";
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        async function previewCalendar() {
            const response = await fetch('/api/calendar?format=preview', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    quarter: QUARTER,
                    enrollCodes: selectedItems.map(i => i.code)
                })
            });

            if (!response.ok) {
                alert("Error generating preview");
                return;
            }

            const events = await response.json();

            console.log("Raw Events from Server:", events);
            if (events.length > 0) {
                console.log("First Event Start:", events[0].start);
                console.log("First Event RRule:", events[0].rrule);
            }
            
            document.getElementById('calModal').style.display = 'block';
            
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                initialDate: '2026-01-05', 
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                slotMinTime: "08:00:00",
                slotMaxTime: "22:00:00",
                events: events,
                height: '100%'
            });
            calendar.render();
        }

        function closeModal() {
            document.getElementById('calModal').style.display = 'none';
            if (calendar) {
                calendar.destroy();
                calendar = null;
            }
        }
        
        window.onclick = function(event) {
            const modal = document.getElementById('calModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
